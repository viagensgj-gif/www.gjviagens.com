# Publica o site no GitHub Pages a cada envio para o branch principal.
# Dispensa configurar a origem na tela de Configurações: o passo "configure-pages"
# liga o Pages sozinho na primeira execução.

name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar a pasta do site
        run: |
          set -euo pipefail
          mkdir -p _site/assets/fonts/Saira_Condensed

          # Arquivos da raiz que o site serve
          cp index.html favicon.svg robots.txt sitemap.xml site.webmanifest _site/

          # CSS, JavaScript, imagens e logo
          cp -r assets/css assets/js assets/img assets/logo _site/assets/

          # Só os 4 pesos da Saira que o CSS usa (os outros 5 ficam de fora)
          for peso in Regular SemiBold Bold ExtraBold; do
            cp "assets/fonts/Saira_Condensed/SairaCondensed-$peso.ttf" \
               _site/assets/fonts/Saira_Condensed/
          done
          cp assets/fonts/Saira_Condensed/OFL.txt _site/assets/fonts/Saira_Condensed/

          echo "--- conteúdo publicado ---"
          find _site -type f | sort
          echo "--- tamanho total ---"
          du -sh _site

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
